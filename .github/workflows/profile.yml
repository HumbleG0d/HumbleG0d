name: generate profile cards

on:
  schedule:
    - cron: "0 18 * * *" # una vez al día
  workflow_dispatch: # lanzarlo a mano desde la pestaña Actions
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Tarjetas holograma (neofetch + stack)
        run: node scripts/generate.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Gráfico 3D de contribuciones
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A assets profile-3d-contrib
          git commit -m "chore: actualizar tarjetas del perfil" || echo "Sin cambios"
          git push
